[package]
name = "zap_stream_app"
version = "1.3.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []

[dependencies]
tokio = { version = "1.40.0", features = ["fs", "rt-multi-thread", "rt", "macros"] }
egui = { version = "0.36.2", default-features = false, features = [] }
egui-wgpu = "0.36.2"
log = "0.4.25"
pretty_env_logger = "0.5.0"
bech32 = "0.11.0"
anyhow = "^1.0.91"
itertools = "0.14.0"
regex = "1"
serde = { version = "1.0.214", features = ["derive"] }
directories = "6.0.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
qrcode = { version = "0.14", default-features = false }
lumina-video = { git = "https://github.com/lumina-video/lumina-video", rev = "ddd8278419ad38f4f0456ee89b534cd46f3c6584" }

nostr = { version = "0.37.0", default-features = false, features = ["std", "nip49", "nip57"] }
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "e22e5632a75e" }
notedeck = { git = "https://github.com/damus-io/notedeck", rev = "93955445ae1853924b17c0973e3c037015dd19b0", package = "notedeck" }
enostr = { git = "https://github.com/damus-io/notedeck", rev = "93955445ae1853924b17c0973e3c037015dd19b0", package = "enostr" }
poll-promise = { version = "0.3.0", features = ["tokio"] }
ehttp = "0.5.0"
ureq = "2.10"
openh264 = "0.9"
icu = "1.5.0"
icu_decimal = "1.5.0"
fixed_decimal = "0.5.6"
lnurl-rs = { version = "0.9.0", default-features = false }
nwc = "0.39.0"
nostr-connect = "0.37"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts", "system_fonts"] }

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "system_fonts"] }
objc2 = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "android-game-activity", "default_fonts", "system_fonts"] }
android_logger = "0.15.0"
jni = "0.21.1"
ndk-context = "0.1"
android-activity = { version = "0.6", features = ["game-activity"] }

[patch.crates-io]
egui = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
eframe = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
egui-winit = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
egui-wgpu = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
egui_system_fonts = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
egui_extras = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
epaint = { git = "https://github.com/v0l/egui", rev = "2f81a2876161a81cea827bdbba8dcdd5b67cdb4a" }
winit = { path = "vendor/winit" }
android-activity = { git = "https://github.com/damus-io/android-activity", rev = "642d4b05836f6cc12c3bd775bcf0d1b467e2014d" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
tokio = { version = "1.40.0", features = ["test-util"] }
tempfile = "3"
nostr-relay-builder = "0.37"
